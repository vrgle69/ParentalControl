ame: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- 1. Installe le SDK Android (ÉTAPE MANQUANTE !) ---
      - name: Install Android SDK
        run: |
          echo "===== Installation du SDK Android ====="
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/sdk-tools.zip
          unzip /tmp/sdk-tools.zip -d $HOME/android-sdk
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-33" "build-tools;33.0.0" > /dev/null
          echo "===== SDK Android installé ====="

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix gradlew permissions
        run: chmod +x gradlew

      - name: Build APK
        run: |
          echo "===== Lancement du build ====="
          ./gradlew :app:assembleDebug --stacktrace
          echo "===== Build terminé ====="

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
