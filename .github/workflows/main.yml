name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix gradlew permissions
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # --- NOUVELLE ÉTAPE : Affiche les logs COMPLETS de Gradle ---
      - name: Build with Gradle (FULL LOGS)
        run: |
          echo "===== 🔍 DÉMARRAGE DU BUILD GRADLE ====="
          ./gradlew clean :app:assembleDebug --stacktrace --debug 2>&1 | tee build_logs.txt
          echo "===== 📄 FIN DES LOGS GRADLE ====="

      # --- NOUVELLE ÉTAPE : Affiche les logs en cas d'erreur ---
      - name: Show Gradle logs on failure
        if: failure()
        run: |
          echo "===== ❌ ERREUR DANS LE BUILD ! VOICI LES LOGS : ====="
          cat build_logs.txt
          echo "===== ❌ FIN DES LOGS D'ERREUR ====="

      - name: Vérifier si l'APK existe
        run: |
          echo "===== 🔎 RECHERCHE DE L'APK ====="
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "✅ ✅ ✅ SUCCÈS ! L'APK A ÉTÉ GÉNÉRÉE ! ✅ ✅ ✅"
            ls -lh app/build/outputs/apk/debug/app-debug.apk
          else
            echo "❌ ❌ ❌ L'APK N'A PAS ÉTÉ GÉNÉRÉE ❌ ❌ ❌"
            echo "Contenu de app/build/outputs/"
            ls -R app/build/outputs/ || echo "Dossier introuvable"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
