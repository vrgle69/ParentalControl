name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- 1. Force les permissions sur gradlew ---
      - name: Fix gradlew permissions
        run: chmod +x gradlew

      # --- 2. Vérifie que gradlew fonctionne ---
      - name: Test gradlew
        run: |
          echo "===== Test de gradlew ====="
          ./gradlew --version || echo "❌ gradlew ne fonctionne pas !"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # --- 3. Lance le build ---
      - name: Build with Gradle
        run: |
          ./gradlew clean :app:assembleDebug --stacktrace

      # --- 4. Cherche et upload l'APK ---
      - name: Find and upload APK
        run: |
          echo "===== Recherche de l'APK ====="
          find . -name "*.apk" -exec echo "✅ APK trouvé : {}" \;
        continue-on-error: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
